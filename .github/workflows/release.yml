name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Verify, build, and publish
    runs-on: ubuntu-24.04
    container: fedora:42

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # `git` is load-bearing twice over, and the container has none of its own:
      # without it `actions/checkout` silently falls back to the REST API
      # tarball, which leaves no `.git` — so `gh` cannot resolve the repo (the
      # publish step below dies on it) and `build.rs` stamps the binary
      # `unknown` instead of its commit.
      - name: Install system dependencies
        run: |
          dnf install --assumeyes \
            alsa-lib-devel \
            gcc \
            gh \
            git \
            gtk4-devel \
            gtk4-layer-shell-devel \
            libadwaita-devel \
            pkgconf-pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Verify tag matches crate version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release
        shell: bash
        run: |
          archive="vibewatch-${GITHUB_REF_NAME}-linux-x86_64-fedora42"
          mkdir -p "dist/${archive}"
          cp target/release/vibewatch LICENSE README.md "dist/${archive}/"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          rm -rf "dist/${archive}"
          (
            cd dist
            sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibewatch-${{ github.ref_name }}-linux-x86_64-fedora42
          path: dist/*
          if-no-files-found: error

      # Create-or-upload rather than plain create: the page may already exist
      # (a re-run of this job, or one made by hand), and the point of the step
      # is that the tag ends up carrying these verified artifacts either way.
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/* \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
