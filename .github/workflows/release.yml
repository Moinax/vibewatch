name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Verify, build, and publish
    runs-on: ubuntu-24.04
    container: fedora:42

    steps:
      # Ahead of the checkout on purpose: `actions/checkout` clones with `git`
      # when it finds one and silently falls back to a REST API tarball when it
      # does not, and the container brings no git of its own. `build.rs` reads
      # the commit from `GITHUB_SHA` when there is no `.git`, so this only buys a
      # real repository rather than being the thing that makes the stamp work.
      - name: Install system dependencies
        run: |
          dnf install --assumeyes \
            alsa-lib-devel \
            gcc \
            gh \
            git \
            gtk4-devel \
            gtk4-layer-shell-devel \
            libadwaita-devel \
            pkgconf-pkg-config

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Verify tag matches crate version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      # The stamp is what `vibewatch --version` reports, and the only way to
      # tell which build a machine is running. It degrades to `unknown` rather
      # than failing the build, so nothing upstream of here notices — v0.7.3 and
      # v0.7.4 both shipped that way. Refuse to publish one that does.
      - name: Verify the binary knows its commit
        shell: bash
        run: |
          stamp="$(target/release/vibewatch --version)"
          echo "$stamp"
          # Only the commit is asserted: the version half is already proven by
          # the tag check above, and matching the whole line would make a release
          # fail on a `--version` reformat. Substring, not equality, because
          # `--short=8` grows past 8 chars when 8 would be ambiguous.
          [[ "$stamp" == *"(${GITHUB_SHA:0:8}"* ]] ||
            { echo "::error::version stamp is not this commit"; exit 1; }

      - name: Package release
        shell: bash
        run: |
          archive="vibewatch-${GITHUB_REF_NAME}-linux-x86_64-fedora42"
          mkdir -p "dist/${archive}"
          cp target/release/vibewatch LICENSE README.md "dist/${archive}/"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          rm -rf "dist/${archive}"
          (
            cd dist
            sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibewatch-${{ github.ref_name }}-linux-x86_64-fedora42
          path: dist/*
          if-no-files-found: error

      # Create-or-upload rather than plain create: the page may already exist
      # (a re-run of this job, or one made by hand), and the point of the step
      # is that the tag ends up carrying these verified artifacts either way.
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/* \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
